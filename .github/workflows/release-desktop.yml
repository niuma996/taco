name: release-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

env:
  NODE_VERSION_FILE: .node-version

jobs:
  # ── Static gates — mirror ci.yml but desktop-scoped ────────────────────
  checks:
    name: type + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.0 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
      - run: node scripts/prepareCiInstall.mjs
      - run: pnpm install --frozen-lockfile
      # protocol:build + shared:build emit the dist/.d.ts declarations
      # that pnpm typecheck needs to resolve cross-workspace imports.
      # Without them a fresh runner fails with TS2307 on every
      # `import "@taco-ai/protocol"` (and "@taco-ai/shared").
      - run: pnpm protocol:build && pnpm shared:build
      - run: pnpm typecheck
      - run: pnpm lint

  # ── Build desktop installers ───────────────────────────────────────────
  # Two Windows installers per release, distinguished only by NSIS
  # webviewInstallMode:
  #   - internal: skip (assumes WebView2 already installed; ~15 MB)
  #   - portable: offlineInstaller (bundles WebView2 Runtime; ~150 MB)
  # Both run on the same windows-2022 runner so they share the sidecar
  # build cost. Override passes through Tauri CLI's --config JSON flag,
  # keeping the canonical conf single-sourced.
  build:
    name: desktop (${{ matrix.variant }})
    needs: checks
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: internal
            webview_install_mode: '{"type":"skip"}'
            artifact_name: taco-desktop-internal-setup-x64
          - variant: portable
            webview_install_mode: '{"type":"offlineInstaller"}'
            artifact_name: taco-desktop-portable-setup-x64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 11.5.0 }

      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          architecture: x64

      # Tauri 2 on Windows builds via MSVC; Rust toolchain is provided by the
      # windows-2022 image, but installing the rust toolchain + target is
      # idempotent and avoids drift if the image changes.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Cache Cargo registry + build artifacts keyed on Cargo.lock + target.
      # Cuts tauri build cold-start from ~10-15 min to ~3-5 min on cache hit.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/taco-desktop/src-tauri -> target
          shared-key: desktop-windows

      - name: Install
        run: |
          node scripts/prepareCiInstall.mjs
          pnpm install --frozen-lockfile

      # Sync the bundle version from the tag so the installed app reports
      # the same version update.json advertises — without this the updater
      # would offer the same release forever (app 0.1.0 < manifest 0.2.0).
      # Dry-runs (workflow_dispatch) keep the committed version.
      - name: Sync version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-')
        shell: bash
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#desktop-v}"
          if [ -z "$V" ] || [ "$V" = "$GITHUB_REF_NAME" ]; then
            echo "::error::could not parse version from tag '$GITHUB_REF_NAME'"
            exit 1
          fi
          sed -i "s|^version = \".*\"|version = \"$V\"|" clients/taco-desktop/src-tauri/Cargo.toml
          sed -i "s|\"version\": \"[^\"]*\"|\"version\": \"$V\"|" clients/taco-desktop/src-tauri/tauri.conf.json

      # Build libs that the desktop bundle imports at runtime (shared,
      # protocol). Sidecar is staged automatically by `tauri build`'s
      # beforeBuildCommand (tauri.conf.json runs stageSidecar.mjs, which
      # owns its own build invocation) — no separate step needed here.
      - run: pnpm protocol:build && pnpm shared:build

      # Vite frontend bundle — produces ../dist which Tauri loads as
      # frontendDist.
      - name: Build frontend
        run: pnpm --filter @taco-ai/desktop build

      # Build the sidecar runtime up front so stageSidecar.mjs's fallback
      # `pnpm package:runtime` path (spawned via tauri build's
      # beforeBuildCommand) is never taken. On Windows runners inside
      # beforeBuildCommand, that sub-spawn loses stderr to Tauri's stdio
      # redirection and CI sees only "[stageSidecar] package:runtime
      # failed (status null)" with no actionable diagnostics. Building it
      # here keeps the failure surface in this step's logs.
      - name: Build sidecar runtime
        shell: bash
        run: |
          echo "pnpm: $(which pnpm || echo MISSING)"
          pnpm --version
          pnpm --filter @taco-ai/sidecar package:runtime -- --target x86_64-pc-windows-msvc --strict

      # Build the CLI bundle up front so stageSidecar.mjs's fallback
      # `pnpm --filter @taco-ai/cli build` path is never taken inside
      # beforeBuildCommand — same Windows sub-spawn issue as the runtime
      # build above (the child's stderr is swallowed and CI sees only
      # "[stageSidecar] CLI bundle missing" with no actionable cause).
      - name: Build CLI bundle
        shell: bash
        run: pnpm --filter @taco-ai/cli build

      # Override webviewInstallMode via --config JSON; leaves every other
      # field at its committed default. installMode stays at currentUser.
      - name: Bundle installer
        shell: bash
        env:
          WEBVIEW_MODE: ${{ matrix.webview_install_mode }}
        run: |
          pnpm --filter @taco-ai/desktop tauri build \
            --config "{\"bundle\":{\"windows\":{\"webviewInstallMode\":${WEBVIEW_MODE}}}}"

      - name: Locate installer
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="${{ matrix.artifact_name }}"
          # Tauri names the NSIS installer <ProductName>_<version>_<arch>-setup.exe
          # inside src-tauri/target/release/bundle/nsis/.
          FOUND=$(find clients/taco-desktop/src-tauri/target/release/bundle/nsis \
            -maxdepth 2 -name '*-setup.exe' -print -quit)
          if [ -z "$FOUND" ]; then
            echo "::error::no NSIS installer found under src-tauri/target/release/bundle/nsis"
            ls -la clients/taco-desktop/src-tauri/target/release/bundle/nsis/ || true
            exit 1
          fi
          cp "$FOUND" "${ARTIFACT}.exe"
          echo "staged=${ARTIFACT}.exe" >> "$GITHUB_OUTPUT"
          # `wc -c` is portable across GNU/BSD/macOS/Windows-Git-bash;
          # GNU `stat -c%s` is missing on BSD/macOS.
          SIZE=$(wc -c < "${ARTIFACT}.exe" | tr -d ' ')
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.locate.outputs.staged }}
          if-no-files-found: error

  # ── Build macOS installers ────────────────────────────────────────────
  # Two .dmg artifacts per release: arm64 (Apple Silicon) + x64 (Intel).
  # Both run on the same macos-13/14 runners so they share no sidecar
  # rebuild cost across the matrix — each variant compiles from scratch.
  # Without code signing + notarization, the .dmg will mount but Gatekeeper
  # will block the first launch with an unidentified-developer warning.
  # Users can right-click → Open to bypass, but it is poor UX.
  build-mac:
    name: desktop (${{ matrix.variant }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: dmg-aarch64
            os: macos-14
            arch: arm64
            artifact_name: taco-desktop-dmg-aarch64
          # dmg-x64 (Intel Mac) omitted from v0.1.0: macos-13 runners are
          # capacity-constrained right now (Aug 2026). Re-add when the
          # runner pool stabilizes or we have a concrete Apple-Intel
          # consumer needing a .dmg.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 11.5.0 }

      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          architecture: ${{ matrix.arch }}

      # macos-13/14 runners ship a default Rust toolchain; pin to stable
      # for reproducibility and add the matching target.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

      # Cargo cache keyed on Cargo.lock + target/. Same shared-key so the
      # two macOS jobs and the windows-2022 jobs do not collide.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/taco-desktop/src-tauri -> target
          shared-key: desktop-darwin

      - name: Install
        run: |
          node scripts/prepareCiInstall.mjs
          pnpm install --frozen-lockfile

      # Same tag→version sync as the Windows build job; the dmg name and
      # the app's self-reported version both come from these two files.
      - name: Sync version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-')
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#desktop-v}"
          if [ -z "$V" ] || [ "$V" = "$GITHUB_REF_NAME" ]; then
            echo "::error::could not parse version from tag '$GITHUB_REF_NAME'"
            exit 1
          fi
          sed -i '' "s|^version = \".*\"|version = \"$V\"|" clients/taco-desktop/src-tauri/Cargo.toml
          sed -i '' "s|\"version\": \"[^\"]*\"|\"version\": \"$V\"|" clients/taco-desktop/src-tauri/tauri.conf.json

      - run: pnpm protocol:build && pnpm shared:build

      - name: Build frontend
        run: pnpm --filter @taco-ai/desktop build

      # Build the sidecar runtime up front so stageSidecar.mjs's fallback
      # `pnpm package:runtime` path (spawned via tauri build's
      # beforeBuildCommand) is never taken. On Windows runners inside
      # beforeBuildCommand, that sub-spawn loses stderr to Tauri's stdio
      # redirection and CI sees only "[stageSidecar] package:runtime
      # failed (status null)" with no actionable diagnostics. macOS does
      # not hit the same spawn issue but prebuilding here keeps the two
      # bundle jobs symmetric and makes the failure surface visible.
      - name: Build sidecar runtime
        run: pnpm --filter @taco-ai/sidecar package:runtime -- --target ${{ matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }} --strict

      # Build the CLI bundle up front so stageSidecar.mjs's fallback
      # `pnpm --filter @taco-ai/cli build` path is never taken inside
      # beforeBuildCommand. Kept symmetric with the Windows build job even
      # though macOS does not hit the sub-spawn issue.
      - name: Build CLI bundle
        run: pnpm --filter @taco-ai/cli build

      # `--bundles app,dmg` is the explicit subset of bundle.targets the
      # Tauri config asks for. We pass a per-arch override so the universal
      # binary is never produced — each .dmg matches the runner arch.
      - name: Bundle installer
        run: pnpm --filter @taco-ai/desktop tauri build --bundles app,dmg

      - name: Locate installer
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="${{ matrix.artifact_name }}"
          # Tauri names the dmg <ProductName>_<version>_<arch>.dmg
          # inside src-tauri/target/release/bundle/dmg/.
          FOUND=$(find clients/taco-desktop/src-tauri/target/release/bundle/dmg \
            -maxdepth 2 -name '*.dmg' -print -quit)
          if [ -z "$FOUND" ]; then
            echo "::error::no dmg found under src-tauri/target/release/bundle/dmg"
            ls -la clients/taco-desktop/src-tauri/target/release/bundle/dmg/ || true
            exit 1
          fi
          cp "$FOUND" "${ARTIFACT}.dmg"
          echo "staged=${ARTIFACT}.dmg" >> "$GITHUB_OUTPUT"
          # `wc -c` is portable across GNU/BSD/macOS; GNU `stat -c%s`
          # and BSD `stat -f %z` differ.
          SIZE=$(wc -c < "${ARTIFACT}.dmg" | tr -d ' ')
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.locate.outputs.staged }}
          if-no-files-found: error

  # ── Sign release artifacts + build updater manifest ──────────────────
  # Gated on tagged pushes (same condition as the release job) so
  # workflow_dispatch dry-runs don't burn the minisign secret. Pulls
  # every dmg/exe artifact from build + build-mac, signs each one with
  # the operator-supplied minisign keypair (see docs/signing.md),
  # generates update.json listing every signed platform, and uploads
  # the whole tree as one composite artifact for `release` to attach.
  sign:
    name: sign + manifest
    needs: [build, build-mac]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Install minisign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="0.11"
          ASSET="minisign-${VERSION}-linux.tar.gz"
          # Verify the tarball's sha256 against a pinned value. jedisct1/minisign
          # release assets do not populate the GitHub release asset digest
          # field, so we can't verify dynamically. Update the pin when bumping
          # VERSION (download from the releases page and `shasum -a 256`).
          EXPECTED_SHA="f0a0954413df8531befed169e447a66da6868d79052ed7e892e50a4291af7ae0"
          curl -fsSL -o /tmp/minisign.tar.gz \
            "https://github.com/jedisct1/minisign/releases/download/${VERSION}/${ASSET}"
          ACTUAL_SHA=$(sha256sum /tmp/minisign.tar.gz | awk '{print $1}')
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::minisign tarball sha256 mismatch (expected ${EXPECTED_SHA}, got ${ACTUAL_SHA})"
            exit 1
          fi
          tar -xzf /tmp/minisign.tar.gz -C /tmp
          sudo install -m 0755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
          minisign -v

      - name: Stage private key
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Write the operator-supplied key to a temp file with strict
          # permissions; minisign -s only takes a path. The passphrase
          # never touches disk.
          install -m 0600 /dev/null /tmp/taco-update.key
          printf '%s\n' "$MINISIGN_PRIVATE_KEY" > /tmp/taco-update.key

      - name: Sign release artifacts
        env:
          MINISIGN_PRIVATE_KEY_PASSPHRASE: ${{ secrets.MINISIGN_PRIVATE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          # -S writes the signature to a separate .minisig file instead of
          # appending to the artifact; -W reads the passphrase from stdin
          # so no PTY is required.
          while IFS= read -r -d '' f; do
            echo "$MINISIGN_PRIVATE_KEY_PASSPHRASE" | minisign -S -s /tmp/taco-update.key -m "$f" -W
            echo "signed $f -> $f.minisig"
          done < <(find dist -type f \( -name '*.dmg' -o -name '*.exe' \) -print0)
          # Wipe the key file before any later step can read /tmp.
          shred -u /tmp/taco-update.key 2>/dev/null || rm -f /tmp/taco-update.key

      - name: Generate update.json
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_PUBLISH_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import base64, json, os, pathlib, time
          tag = os.environ['TAG']
          base = os.environ['RELEASE_PUBLISH_URL']
          version = tag.removeprefix('desktop-v')
          platforms = {}
          for path in sorted(pathlib.Path('dist').rglob('*')):
              if not path.is_file() or path.suffix not in ('.dmg', '.exe'):
                  continue
              sig = path.with_suffix(path.suffix + '.minisig')
              if not sig.exists():
                  raise SystemExit(f'missing signature for {path}')
              name = path.name
              # tauri-plugin-updater expects darwin-aarch64, darwin-x86_64,
              # windows-x86_64, windows-aarch64 — derive from the file name.
              # Two Windows x64 installers ship per release (internal /
              # portable) and both map to windows-x86_64; the manifest can
              # only carry one. Prefer the leaner 'internal' installer and
              # skip 'portable' (it stays on the release for manual download).
              if name.endswith('.exe') and 'portable' in name:
                  print(f'skipping {name} from manifest (internal preferred for windows-x86_64)')
                  continue
              is_arm = 'aarch64' in name or 'arm64' in name
              if name.endswith('.dmg'):
                  platform = 'darwin-aarch64' if is_arm else 'darwin-x86_64'
              else:
                  platform = 'windows-aarch64' if is_arm else 'windows-x86_64'
              if platform in platforms:
                  raise SystemExit(f'duplicate platform {platform} from {name}')
              platforms[platform] = {
                  'signature': base64.b64encode(sig.read_bytes()).decode('ascii'),
                  'url': f'{base}/{name}',
              }
          if not platforms:
              raise SystemExit('no signed artifacts found')
          manifest = {
              'version': version,
              'pub_date': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'platforms': platforms,
          }
          pathlib.Path('dist/update.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: signed-desktop-bundle
          path: |
            dist/taco-desktop-dmg-aarch64/**
            dist/taco-desktop-internal-setup-x64/**
            dist/taco-desktop-portable-setup-x64/**
            dist/update.json
          if-no-files-found: error

  # ── Publish GitHub Release ───────────────────────────────────────────────
  # Attaches the signed bundle (artifacts + .minisig sidecars + update.json)
  # to a GitHub Release named after the tag (e.g. tag `desktop-v0.1.0` →
  # release `desktop-v0.1.0`). Only fires on tagged pushes; dry-runs via
  # workflow_dispatch on main upload artifacts only and skip the release
  # so we don't publish a release during testing.
  release:
    name: release
    needs: [sign]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create a release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-desktop-bundle
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/taco-desktop-dmg-aarch64/taco-desktop-dmg-aarch64.dmg
            dist/taco-desktop-dmg-aarch64/taco-desktop-dmg-aarch64.dmg.minisig
            dist/taco-desktop-internal-setup-x64/taco-desktop-internal-setup-x64.exe
            dist/taco-desktop-internal-setup-x64/taco-desktop-internal-setup-x64.exe.minisig
            dist/taco-desktop-portable-setup-x64/taco-desktop-portable-setup-x64.exe
            dist/taco-desktop-portable-setup-x64/taco-desktop-portable-setup-x64.exe.minisig
            dist/update.json
