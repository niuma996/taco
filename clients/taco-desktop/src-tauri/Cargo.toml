[package]
name = "taco-desktop"
version = "0.1.3"
description = "Taco 桌面客户端 — 通过 NDJSON sidecar 调用 taco runtime"
authors = ["taco team"]
edition = "2021"

[lib]
name = "taco_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "TACO"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-store = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-single-instance = "2.0"
tauri-plugin-updater = "2.0"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.0", features = ["fs", "io-util", "process", "sync", "rt", "time", "net", "macros"] }
sha2 = "0.10"

# Used only by the debug-only dev dock icon override in lib.rs. Versions and
# feature sets mirror what tauri already pulls in, so this adds no new build
# cost. See apply_dev_dock_icon for why the override is needed.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
