packages:
  - "packages/*"
  - "clients/*"
# CI installs an already reviewed committed lockfile. New resolutions still pass the
# release-age policy when they are created; frozen installs do not re-evaluate it.
trustLockfile: true
allowBuilds:
  '@biomejs/biome': true
  '@google/genai': false
  esbuild: true
  protobufjs: false
# Pre-resolve native sidecar packages for every supported platform so that
# pnpm-lock.yaml stays stable when developers switch between macOS and Windows;
# without this, installing on one platform rewrites the lockfile to drop the
# other platform's entries, producing noisy cross-machine diffs.
supportedArchitectures:
  - os: darwin
    cpu: arm64
  - os: win32
    cpu: x64
minimumReleaseAgeExclude:
  - '@taco-ai/sidecar-darwin-arm64@0.1.0'
  - '@taco-ai/sidecar-win32-x64@0.1.0'
  - typebox@1.3.30
  # @taco-ai/pi-harness is published alongside this change, so it is inside the
  # 24h gate on the day it lands. Drop this entry once that version is older.
  - '@taco-ai/pi-harness@0.1.0'
  # lucide-react 1.61.0 was published less than 24h before the upgrade landed.
  # Drop this entry once that version is older.
  - lucide-react@1.61.0
  # pele 1.13.0 was published less than 24h before the upgrade landed.
  # Drop this entry once that version is older.
  - pele@1.13.0
  - '@taco-ai/pi-harness'
  - '@taco-ai/pi-harness@0.2.0'
peerDependencyRules:
  ignoreMissing:
    - "@earendil-works/*"
    # Platform packages under @taco-ai/sidecar-<platform> do not exist on
    # the npm registry until the matching sidecar-v* release publishes them;
    # until that point pnpm cannot resolve them and would otherwise fail
    # the --frozen-lockfile install on CI. ignoreMissing suppresses the
    # missing-peer warning while leaving the optionalDependency wiring
    # in packages/sidecar/package.json intact.
    - "@taco-ai/sidecar-*"
